  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    :root {
      --g: #006E39;
      --g2: #004D27;
      --g3: #0B8A4A;
      --gold: #FFC20E;
      --gold2: #E5A800;
      --cream: #F3F8EF;
      --ink: #10281A;
      --mut: #5C7566;
      --ln: #D3E2D4;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: 'Plus Jakarta Sans', Arial, sans-serif;
      background:
        radial-gradient(1200px 600px at 50% -10%, #0B8A4A 0%, transparent 60%),
        var(--g);
      color: var(--ink);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      background: var(--cream);
      padding: 25px;
      border-radius: 22px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 18px 60px #0005;
      border-top: 6px solid var(--gold);
      text-align: center;
    }

    .logo {
      width: 96px;
      height: 96px;
      margin: 0 auto 14px;
      display: block;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 10px 24px #006E3944;
    }

    h2 {
      margin: 0;
      font-size: 22px;
      font-weight: 800;
      color: var(--g);
    }

    p {
      color: var(--mut);
      line-height: 1.5;
    }

    #reader {
      width: 100%;
      margin: 20px auto;
      overflow: hidden;
      border-radius: 14px;
      background: #fff;
      border: 2px solid var(--ln);
    }

    #reader video {
      object-fit: cover;
    }

    button {
      width: 100%;
      border: 0;
      padding: 16px;
      border-radius: 12px;
      background: var(--gold);
      color: var(--g2);
      font-family: inherit;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 10px;
      transition: transform .12s, filter .12s;
    }

    button:hover {
      filter: brightness(1.05);
    }

    button:active {
      transform: scale(.98);
    }

    button:disabled {
      opacity: .5;
      cursor: wait;
    }

    button.secondary {
      background: var(--g);
      color: #fff;
    }

    button.light {
      background: #fff;
      color: var(--g);
      border: 1.5px solid var(--ln);
    }

    #status {
      padding: 13px;
      background: #006E3912;
      color: var(--g2);
      border-radius: 10px;
      font-size: 14px;
      overflow-wrap: anywhere;
      margin-top: 15px;
    }

    #status.success {
      background: #006E3922;
      color: var(--g);
      font-weight: 700;
    }

    #status.error {
      background: #c0392b18;
      color: #b83225;
    }

    #result {
      display: none;
      margin-top: 15px;
    }

    #decoded {
      padding: 12px;
      background: #fff;
      border: 1px solid var(--ln);
      border-radius: 10px;
      overflow-wrap: anywhere;
      color: var(--ink);
      font-weight: bold;
    }

    .badge {
      display: inline-block;
      background: var(--g);
      color: var(--gold);
      padding: 7px 12px;
      border-radius: 30px;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .footer {
      margin-top: 18px;
      font-size: 11px;
      color: var(--mut);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

  <script>
    'use strict';

    let scanner = null;
    let qrValue = '';
    let finished = false;
    let sending = false;
    let sent = false;

    const $ = id => document.getElementById(id);

    function setStatus(message, type) {
      const el = $('status');

      el.textContent = message;
      el.className = type || '';
    }

    /* CEK DASHBOARD ADMIN */

    function dashboardAvailable() {
      try {
        return !!(
          window.opener &&
          !window.opener.closed
        );
      } catch (e) {
        return false;
      }
    }

    /* MEMULAI KAMERA */

    async function startScanner() {

      if (scanner) {
        await stopScanner();
      }

      const start = $('start');
      const stop = $('stop');

      start.disabled = true;

      setStatus('Meminta izin akses kamera...');

      try {

        if (!window.isSecureContext) {
          throw new Error(
            'Halaman harus dibuka melalui HTTPS.'
          );
        }

        if (
          !navigator.mediaDevices ||
          !navigator.mediaDevices.getUserMedia
        ) {
          throw new Error(
            'Browser tidak mendukung akses kamera.'
          );
        }

        scanner = new Html5Qrcode('reader');

        await scanner.start(
          { facingMode: 'environment' },

          {
            fps: 10,
            qrbox: {
              width: 230,
              height: 230
            },
            aspectRatio: 1
          },

          async function(text) {

            if (finished) return;

            finished = true;
            qrValue = String(text).trim();

            setStatus('QR ditemukan. Mengirim ke dashboard...');

            await stopScanner();

            $('decoded').textContent = qrValue;

            $('reader').classList.add('hidden');
            $('result').style.display = 'block';

            $('start').classList.add('hidden');
            $('stop').classList.add('hidden');

            // Otomatis kirim hasil scan ke Apps Script.
            await sendResult();

          },

          function() {
            // Abaikan error saat belum menemukan QR.
          }
        );

        start.classList.add('hidden');
        stop.classList.remove('hidden');

        setStatus(
          'Kamera aktif. Arahkan kamera ke QR pelanggan.'
        );

      } catch (err) {

        scanner = null;

        start.disabled = false;
        start.classList.remove('hidden');
        stop.classList.add('hidden');

        let message = err.message || String(err);

        if (
          err.name === 'NotAllowedError' ||
          /permission|denied|notallowed/i.test(message)
        ) {
          message =
            'Akses kamera ditolak. Periksa izin kamera browser.';
        }

        setStatus(
          'Kamera gagal dibuka: ' + message,
          'error'
        );
      }
    }

    /* MEMATIKAN KAMERA */

    async function stopScanner() {

      if (!scanner) return;

      const oldScanner = scanner;
      scanner = null;

      try {
        if (oldScanner.isScanning) {
          await oldScanner.stop();
        }
      } catch (e) {}

      try {
        oldScanner.clear();
      } catch (e) {}
    }

    /* KIRIM QR KE DASHBOARD APPS SCRIPT */

    async function sendResult() {

      if (!qrValue || sending) return;

      if (!dashboardAvailable()) {

        setStatus(
          'Dashboard admin tidak terhubung. Buka scanner melalui tombol dari dashboard admin.',
          'error'
        );

        return;
      }

      sending = true;

      const btn = $('sendButton');

      btn.disabled = true;
      btn.textContent = 'MENGIRIM...';

      try {

        window.opener.postMessage(
          {
            type: 'BRONGSONG_QR_RESULT',
            value: qrValue
          },
          '*'
        );

        sent = true;

        btn.textContent = 'TERKIRIM KE DASHBOARD ✓';

        setStatus(
          'QR telah dikirim ke dashboard admin. Silakan periksa hasil stamp di tab dashboard.',
          'success'
        );

      } catch (e) {

        setStatus(
          'Gagal mengirim QR: ' + e.message,
          'error'
        );

        btn.textContent = 'COBA KIRIM LAGI';

      } finally {

        sending = false;
        btn.disabled = false;
      }
    }

    /* SALIN QR */

    async function copyResult() {

      if (!qrValue) return;

      try {

        await navigator.clipboard.writeText(qrValue);

        setStatus(
          'Kode QR berhasil disalin.',
          'success'
        );

      } catch (e) {

        setStatus(
          'Tidak dapat menyalin otomatis. Salin kode secara manual.',
          'error'
        );
      }
    }

    /* SCAN ULANG */

    async function scanAgain() {

      await stopScanner();

      qrValue = '';
      finished = false;
      sending = false;
      sent = false;

      $('reader').classList.remove('hidden');
      $('result').style.display = 'none';

      $('start').classList.remove('hidden');
      $('start').disabled = false;

      $('stop').classList.add('hidden');

      $('sendButton').textContent =
        'KIRIM KE DASHBOARD ADMIN';

      setStatus(
        'Siap melakukan pemindaian QR berikutnya.'
      );

      await startScanner();
    }

    /* BERSIHKAN KAMERA SAAT HALAMAN DITUTUP */

    window.addEventListener('pagehide', function() {

      if (scanner) {
        try {
          scanner.stop();
        } catch (e) {}
      }

    });

  </script>

</body>
</html>
